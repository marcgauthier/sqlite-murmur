[package]
name = "murmur-files"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[dependencies]
aws-lc-rs = "=1.18.2"
murmur-tx = { path = "../murmur-tx" }
tokio = { version = "=1.54.1", features = ["rt-multi-thread"] }
zeroize = "=1.9.1"
serde_json = "=1.0.154"

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["macros"] }

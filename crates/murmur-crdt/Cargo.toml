[package]
name = "murmur-crdt"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
description = "Shared Murmur CRDT core reused by sqlite-murmur"
license = "MIT"

[lib]
crate-type = ["rlib"]

[features]
default = []
replication = []

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
postcard = { version = "=1.1.3", features = ["alloc"] }
sha2 = "=0.10.9"
uuid = { version = "=1.28.0", features = ["v5"] }
rusqlite = { version = "=0.40.2", default-features = false }

[dev-dependencies]
rand = "=0.8.8"

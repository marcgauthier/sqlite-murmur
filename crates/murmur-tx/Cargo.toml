[package]
name = "murmur-tx"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros", "fs"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
x509-cert = "0.2.5"
aws-lc-rs = "=1.18.2"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
thiserror = "2"
zeroize = "1"
ipnet = { version = "=2.12.2", features = ["serde"] }
chacha20poly1305 = "=0.10.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-webpki-roots-no-provider"] }

[dev-dependencies]
rcgen = { version = "=0.13.2", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "3"

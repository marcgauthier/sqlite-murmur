[package]
name = "murmur-replication"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[features]
default = []
loadable = ["rusqlite/loadable_extension"]

[dependencies]
aws-lc-rs = "=1.18.2"
murmur-tx = { path = "../murmur-tx" }
murmur-policy = { path = "../murmur-policy" }
murmur-query = { path = "../murmur-query" }
murmur-sched = { path = "../murmur-sched" }
murmur-files = { path = "../murmur-files" }
rusqlite = { version = "=0.40.2", features = ["functions", "vtab"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
x509-cert = "0.2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
thiserror = "2"
zeroize = "1"
ipnet = { version = "=2.12.2", features = ["serde"] }

[dev-dependencies]
rcgen = { version = "=0.13.2", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "3"

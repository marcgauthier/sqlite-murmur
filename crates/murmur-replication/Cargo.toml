[package]
name = "murmur-replication"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[features]
default = []
loadable = ["rusqlite/loadable_extension"]

[dependencies]
murmur-tx = { path = "../murmur-tx" }
murmur-policy = { path = "../murmur-policy" }
murmur-query = { path = "../murmur-query" }
murmur-sched = { path = "../murmur-sched" }
murmur-files = { path = "../murmur-files" }
rusqlite = { version = "=0.40.2", features = ["functions", "vtab"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
x509-cert = "0.2.5"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
thiserror = "2"
rand = "0.8"
zeroize = "1"
ipnet = { version = "2", features = ["serde"] }

[dev-dependencies]
rcgen = "=0.13.2"
tempfile = "3"

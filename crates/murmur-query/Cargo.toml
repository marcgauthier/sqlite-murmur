[package]
name = "murmur-query"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[features]
default = ["vector"]
vector = ["dep:sqlite-vec"]

[dependencies]
aws-lc-rs = "=1.18.2"
rusqlite = { version = "=0.40.2", features = ["functions"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
postcard = { version = "=1.1.3", features = ["alloc"] }
thiserror = "=2.0.21"
sqlite-vec = { version = "=0.1.6", optional = true }

[dev-dependencies]
tempfile = "=3.27.0"

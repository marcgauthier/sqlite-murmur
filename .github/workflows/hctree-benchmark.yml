name: HCTree vs SQLite Murmur benchmark
on:
  workflow_dispatch:
  push:
    branches:
      - benchmark/hctree-compare
    paths:
      - 'benchmarks/hctree/**'
      - 'benchmarks/benchmark.cpp'
      - 'third-party/source-files.sha256'
      - '.github/workflows/hctree-benchmark.yml'
concurrency:
  group: hctree-benchmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Cache the RocksDB/SQLite C++ objects across diagnostic iterations.
      # ccache is enabled by benchmarks/hctree/run.sh when installed.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: hctree-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            hctree-ccache-${{ runner.os }}-
      - run: sudo apt-get update -qq && sudo apt-get install -y cmake g++ make perl python3 curl libclang-dev pkg-config binutils tcl-dev autoconf automake libtool ccache
      - run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly-2023-10-05 --profile minimal
      - run: python3 third-party/verify.py
      - name: Benchmark all eight cases
        run: |
          set -o pipefail
          bash benchmarks/hctree/run.sh 2>&1 | tee hctree-run.log
      - name: Inspect HC-tree file I/O after a failed benchmark
        if: failure()
        run: |
          mkdir -p hctree-benchmark-results
          {
            echo "HC-tree storage I/O source audit (diagnostic, not proof of active call paths)"
            for file in hctree-benchmark-results/hctree-src/src/hct_file.c hctree-benchmark-results/hctree-src/src/hct_pman.c hctree-benchmark-results/hctree-src/src/hct_database.c; do
              if test -f "$file"; then
                echo "=== $file ==="
                grep -nE '(^|[^[:alnum:]_])(mmap|munmap|open|pread|pwrite|ftruncate|sqlite3OsOpen|sqlite3OsRead|sqlite3OsWrite)[[:space:]]*\(' "$file" | head -n 100 || true
              fi
            done
          } | tee hctree-benchmark-results/hctree-storage-audit.txt
      - name: Show compiler cache statistics
        if: always()
        run: ccache -s || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hctree-comparison-results
          path: |
            hctree-benchmark-results/*.txt
            hctree-benchmark-results/*.csv
            hctree-benchmark-results/*.sha256
            hctree-run.log
          if-no-files-found: ignore
